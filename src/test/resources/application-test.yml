spring:
  application:
    name: "orders-test"
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      javax:persistence.schema-generation.database.action: none
kafka:
  topic:
    orders:
      receive: "test-orders-topic"
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG