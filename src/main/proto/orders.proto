syntax = "proto3";

option java_package = "tgb.cryptoexchange.grpc.generated";
option java_multiple_files = true;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

import "buf/validate/validate.proto";

service OrdersService {
  rpc CreateOrder (CreateOrderGrpc) returns (CreateOrderResponseGrpc);
  rpc UpdateOrderStatus (UpdateOrderStatusGrpc) returns(google.protobuf.Empty);
}

message CreateOrderGrpc {
  int64 client_id = 1 [(buf.validate.field).int64.gt = 0];
  string internal_id = 2 [(buf.validate.field).string.min_len = 1];
  string merchant = 3 [(buf.validate.field).string.pattern = "^[A-Z_]+$"];
  string merchant_order_id = 4 [(buf.validate.field).string.min_len = 1];
  string merchant_order_status = 5 [(buf.validate.field).string.pattern = "^[A-Z_]+$"];
  int32 amount = 6 [(buf.validate.field).int32.gt = 0];
  bool enable_unique_amount = 7;
  optional string callback_url = 8 [(buf.validate.field).string.uri = true];
}

message CreateOrderResponseGrpc {
  string id = 1;
  int64 client_id = 2;
  string internal_id = 3;
  string status = 4;
  int32 amount = 5;
  bool enable_unique_amount = 6;
  optional string callback_url = 7;
}

message UpdateOrderStatusGrpc {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string status = 2 [(buf.validate.field).string.pattern = "^[A-Z_]+$"];
}
